services:
  nextcloud:
    image: kefaslungu/hng-nextcloud
    container_name: nextcloud
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - HNG-nginx-logs:/var/log/nginx
    depends_on:
      - nextcloud

volumes:
  HNG-nginx-logs:
